procs:
  rosbag:
    shell: 'bash -c "source /root/workspace/install/setup.bash && sleep 2 && ros2 bag play /datasets/rosbags/real/gamma/Gamma_Garage"'
    autostart: false
  s_graphs:
    shell: 'bash -c "source /root/workspace/install/setup.bash && ros2 launch lidar_situational_graphs s_graphs_launch.py lidar_topic:=/cloud/undistorted base_frame:=base_link compute_odom:=false"'
    autostart: false
  fast_lio:
    shell: 'bash -c "source /root/workspace/install/setup.bash && ros2 launch fast_lio mapping.launch.py rviz:=false config_file:=ouster64.yaml"'
    autostart: true
  rviz:
    shell: 'bash -c "source /root/workspace/install/setup.bash && rviz2 -d /root/workspace/src/situational_graphs/lidar_situational_graphs/rviz/s_graphs_ros2.rviz"'
    autostart: true
